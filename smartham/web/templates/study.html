<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Library · SmartHam</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=2">
  <link rel="stylesheet" href="/static/css/feedback-themes.css?v=1">
</head>
<body>
  <div class="app">
    {% include "_nav.html" %}

    <main class="main">
      <section class="panel">
        <div class="panel-head">
          <h2>Reference Material</h2>
        </div>
        <div class="log-scroll" id="study-list">
          <p class="summary-empty">Loading study sections…</p>
        </div>
      </section>

      <section class="panel summary-panel feedback-panel">
        <div class="panel-head summary-panel-head">
          <h2>Section</h2>
          <div class="actions-row" style="margin:0">
            <label class="summary-theme-picker">
              <span>Theme</span>
              <select class="summary-theme-select" data-theme-select aria-label="Study display theme"></select>
            </label>
            <button type="button" class="btn btn-primary btn-small" id="btn-summarize" disabled>Summarize with Ollama</button>
          </div>
        </div>
        {% include "_feedback_chassis.html" %}
      </section>
    </main>
  </div>
  <script src="/static/js/app.js?v=3"></script>
  <script src="/static/js/study.js?v=2"></script>
</body>
</html>
