<a
  href="/quiz?question={{ q.id }}"
  class="progress-box progress-box-link {{ extra_class }}{% if q.mastered %} is-mastered{% elif q.missed %} is-missed{% endif %}"
  title="{{ q.id }}{% if q.mastered %} — answered correctly{% elif q.missed %} — answered incorrectly{% endif %}"
  aria-label="{{ q.id }}{% if q.mastered %} — answered correctly{% elif q.missed %} — answered incorrectly{% endif %}"
></a>
