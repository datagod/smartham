[project]
name = "smartham"
version = "0.1.0"
description = "Canadian amateur radio exam study platform with Ollama tutoring and gamified awards"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "datagod"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0",
  "pymupdf>=1.24",
]

[project.scripts]
smartham = "smartham.cli:main"

[project.urls]
Homepage = "https://github.com/datagod/smartham"
Repository = "https://github.com/datagod/smartham"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartham"]